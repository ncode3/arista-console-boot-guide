---
# Ansible Inventory for Arista Switches
# File: ansible/inventory/hosts.yml

all:
  children:
    arista_switches:
      hosts:
        aari-sw01:
          ansible_host: 192.168.1.10
          ansible_network_os: arista.eos.eos
          ansible_connection: network_cli
          ansible_user: admin
          ansible_password: "{{ vault_switch_password }}"
          
          # Switch-specific variables
          switch_hostname: aari-dc-sw01
          management_ip: 192.168.1.10/24
          management_gateway: 192.168.1.1
          
          vlans:
            - id: 100
              name: MGMT
            - id: 200
              name: OPENSHIFT_MGMT
            - id: 300
              name: OPENSHIFT_DATA
            - id: 400
              name: PENTEST_LAB
            - id: 500
              name: STUDENT_DEV

      vars:
        # Common variables for all Arista switches
        ansible_become: yes
        ansible_become_method: enable
        
        # NTP servers
        ntp_servers:
          - time.google.com
          - time.cloudflare.com
        
        # DNS servers
        dns_servers:
          - 8.8.8.8
          - 1.1.1.1
        
        # Timezone
        timezone: America/New_York
        
        # SSH settings
        ssh_idle_timeout: 15
