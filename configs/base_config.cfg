! Arista Switch - Base Configuration
! Minimal working configuration for initial setup
! Tested on: Arista DCS-7020TR-48, EOS 4.20.5.1M
! Last updated: 2024-12-31

! Set hostname
hostname aari-sw01

! Configure management interface
interface Management1
   description "Out-of-band management"
   ip address 192.168.1.10/24
   no shutdown

! Set default route for management
ip route 0.0.0.0/0 192.168.1.1

! Configure DNS
ip name-server vrf default 8.8.8.8
ip name-server vrf default 1.1.1.1

! Set timezone
clock timezone America/New_York

! Configure NTP
ntp server time.google.com prefer
ntp server time.cloudflare.com

! Enable SSH
management ssh
   idle-timeout 15

! Create admin user (change password!)
username admin privilege 15 secret CHANGEME

! Basic logging
logging buffered 10000
logging console informational

! Save configuration
! write memory
