! Arista Switch - Data Center Configuration
! Full production configuration for AARI data center
! Supports: OpenShift cluster, security labs, student environments
! Tested on: Arista DCS-7020TR-48, EOS 4.20.5.1M

! ===== SYSTEM CONFIGURATION =====

hostname aari-dc-sw01

! Banner
banner motd
**************************************************
*  AARI Data Center - Authorized Access Only     *
*  Atlanta AI & Robotics Initiative              *
*  All activity is monitored and logged          *
**************************************************
EOF

! ===== MANAGEMENT INTERFACE =====

interface Management1
   description "OOB Management - VLAN 999"
   vrf management
   ip address 192.168.1.10/24
   no shutdown

ip route vrf management 0.0.0.0/0 192.168.1.1

! ===== VLANs =====

! Management VLAN
vlan 100
   name MGMT
   
! OpenShift Management Network
vlan 200
   name OPENSHIFT_MGMT
   
! OpenShift Data Network
vlan 300
   name OPENSHIFT_DATA

! Penetration Testing Lab (Isolated)
vlan 400
   name PENTEST_LAB

! Student Development Environment
vlan 500
   name STUDENT_DEV

! Out-of-Band Management
vlan 999
   name OOB_MGMT

! ===== LAYER 3 INTERFACES (SVIs) =====

! Enable IP routing
ip routing

interface Vlan100
   description "Management network gateway"
   ip address 10.0.100.1/24
   no shutdown

interface Vlan200
   description "OpenShift management gateway"
   ip address 10.0.200.1/24
   no shutdown

interface Vlan300
   description "OpenShift data network gateway"
   ip address 10.0.300.1/24
   no shutdown

interface Vlan400
   description "Pentest lab gateway (isolated)"
   ip address 10.0.400.1/24
   no shutdown

interface Vlan500
   description "Student dev gateway"
   ip address 10.0.500.1/24
   no shutdown

! ===== PHYSICAL INTERFACES =====

! Uplink to Core/Firewall
interface Ethernet1
   description "Uplink to firewall/core"
   switchport mode trunk
   switchport trunk allowed vlan 100,200,300,400,500
   spanning-tree portfast trunk

! OpenShift Node 1
interface Ethernet10
   description "OpenShift Master Node 1"
   switchport mode trunk
   switchport trunk allowed vlan 200,300
   spanning-tree portfast trunk

! OpenShift Node 2
interface Ethernet11
   description "OpenShift Worker Node 1"
   switchport mode trunk
   switchport trunk allowed vlan 200,300
   spanning-tree portfast trunk

! OpenShift Node 3
interface Ethernet12
   description "OpenShift Worker Node 2"
   switchport mode trunk
   switchport trunk allowed vlan 200,300
   spanning-tree portfast trunk

! Security Lab Isolated Network
interface Ethernet20-24
   description "Pentest Lab - Isolated"
   switchport mode access
   switchport access vlan 400
   spanning-tree portfast

! Student Development Ports
interface Ethernet30-40
   description "Student Development Access"
   switchport mode access
   switchport access vlan 500
   spanning-tree portfast

! ===== SPANNING TREE =====

spanning-tree mode rapid-pvst
spanning-tree vlan-id 100,200,300,400,500 priority 4096

! ===== SERVICES =====

! DNS
ip name-server vrf default 8.8.8.8
ip name-server vrf default 1.1.1.1

! NTP
clock timezone America/New_York
ntp server time.google.com prefer
ntp server time.cloudflare.com

! SSH
management ssh
   idle-timeout 15
   authentication mode keyboard-interactive

! Disable HTTP
no ip http server

! ===== USER ACCOUNTS =====

! Admin user (change password!)
username admin privilege 15 secret CHANGE_ME_IMMEDIATELY

! Ansible automation user
username ansible privilege 15 secret ANSIBLE_PASSWORD
username ansible sshkey ssh-rsa AAAAB3NzaC1yc2E... ansible@automation

! ===== LOGGING =====

logging buffered 100000
logging console warnings
logging host 10.0.100.50

! ===== SECURITY =====

! Access control for management
ip access-list standard MGMT-ACCESS
   10 permit 10.0.100.0/24
   20 permit 192.168.1.0/24
   30 deny any log

! Apply ACL to management VLAN
interface Vlan100
   ip access-group MGMT-ACCESS in

! Disable CDP on untrusted ports
no cdp run

! Enable port security on access ports (optional - configure per port)
! switchport port-security
! switchport port-security maximum 3
! switchport port-security violation restrict

! ===== MONITORING =====

! SNMP (configure community strings!)
snmp-server community CHANGE_ME ro
snmp-server host 10.0.100.50 version 2c CHANGE_ME

! ===== SAVE CONFIGURATION =====

! write memory
